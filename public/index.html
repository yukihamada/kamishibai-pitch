<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ロジックの、向こう側 — 動くピッチ紙芝居</title>
<meta name="description" content="MU・bim.house・JiuFlow。語りをめくると、本物が動き出す。pre 100億・10億円を、ロジックじゃなく確信で出す投資家の紙芝居。">
<meta property="og:title" content="ロジックの、向こう側">
<meta property="og:description" content="紙芝居をめくると、プロダクトが生きて動く。触れる投資ピッチ。">
<meta property="og:type" content="website">
<style>
  :root{
    --ink:#1a1410; --paper:#f4 ece0; --paper:#f5eee1; --fire:#ff7a18; --fire2:#ffb347;
    --gold:#e9c46a; --night:#0b0d16; --night2:#161a2b; --line:rgba(255,255,255,.12);
    --muted:#9aa0b4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    background:var(--night); color:#fff; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ====== Stage ====== */
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
  .scene{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:max(20px,env(safe-area-inset-top)) 18px 86px;
    opacity:0; transform:translateX(40px) scale(.98); pointer-events:none;
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
    text-align:center;
  }
  .scene.active{opacity:1; transform:none; pointer-events:auto;}
  .scene.prev{transform:translateX(-40px) scale(.98);}
  .frame{
    width:min(880px,94vw); max-height:84vh; border-radius:22px; overflow:hidden;
    background:radial-gradient(120% 120% at 50% 0%,var(--night2),#0c0f1a);
    border:1px solid var(--line); box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    display:flex; flex-direction:column; position:relative;
  }
  .art{position:relative; flex:1 1 auto; min-height:300px; overflow:hidden;}
  .frame.demo{max-height:90vh;} .frame.demo .narr{padding:11px 18px 13px;}
  .frame.demo .art{flex:none; height:48vh; min-height:340px;}
  .narr{
    padding:16px 22px 20px; background:linear-gradient(0deg,#0a0c14,rgba(10,12,20,.2));
    border-top:1px solid var(--line);
  }
  .kicker{font-size:12px; letter-spacing:.32em; color:var(--gold); text-transform:uppercase; margin:0 0 8px;}
  .narr h2{margin:0 0 8px; font-size:clamp(19px,3.6vw,26px); line-height:1.35; font-weight:800;}
  .narr p{margin:0; color:#d7dae6; font-size:clamp(13px,2.7vw,15.5px); line-height:1.75;}
  .narr p .em{color:var(--fire2); font-weight:700;}
  /* ====== HUD ====== */
  #hud{position:fixed; top:0; left:0; right:0; padding:12px 16px calc(10px); display:flex;
    align-items:center; gap:12px; z-index:30; pointer-events:none;}
  #title{font-size:13px; font-weight:800; letter-spacing:.04em; opacity:.9;}
  #title small{display:block; font-weight:500; color:var(--muted); letter-spacing:.18em; font-size:9.5px;}
  #meterWrap{flex:1 1 auto; display:flex; align-items:center; gap:8px; max-width:340px; margin-left:auto;}
  #meter{flex:1; height:7px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; position:relative;}
  #meterFill{position:absolute; inset:0; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#3a2,var(--gold),var(--fire)); transition:width .6s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 14px rgba(255,150,40,.5);}
  #meterTxt{font-size:10px; color:var(--gold); font-weight:800; white-space:nowrap; width:84px; text-align:right;}
  #voiceBtn{pointer-events:auto; cursor:pointer; border:1px solid var(--line); background:rgba(255,255,255,.06);
    color:#fff; border-radius:99px; padding:5px 11px 5px 9px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px;
    backdrop-filter:blur(8px); transition:.2s; white-space:nowrap;}
  #voiceBtn.speaking{border-color:var(--fire2); box-shadow:0 0 0 0 rgba(255,179,71,.5); animation:spk 1.3s ease-out infinite;}
  #voiceBtn.off{opacity:.45;} #voiceBtn #voiceState{font-size:10px; color:var(--gold); letter-spacing:.04em;}
  #voiceBtn.off #voiceState{color:var(--muted);}
  @keyframes spk{0%{box-shadow:0 0 0 0 rgba(255,179,71,.45);}100%{box-shadow:0 0 0 9px rgba(255,179,71,0);}}
  @media (max-width:560px){ #voiceBtn #voiceState{display:none;} #title small{display:none;} }
  /* ====== Nav ====== */
  #nav{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; align-items:center;
    justify-content:center; gap:14px; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(7,8,14,.9),transparent);}
  .navbtn{pointer-events:auto; cursor:pointer; user-select:none; border:1px solid var(--line);
    background:rgba(255,255,255,.06); color:#fff; border-radius:99px; padding:11px 20px; font-size:14px;
    font-weight:700; display:flex; align-items:center; gap:7px; backdrop-filter:blur(8px);
    transition:transform .15s, background .2s, opacity .2s;}
  .navbtn:active{transform:scale(.94);}
  .navbtn.primary{background:linear-gradient(135deg,var(--fire),var(--fire2)); color:#1a1008; border:none;
    box-shadow:0 6px 22px rgba(255,122,24,.4);}
  .navbtn[disabled]{opacity:.3; pointer-events:none;}
  #dots{display:flex; gap:6px;}
  .dot{width:7px; height:7px; border-radius:99px; background:rgba(255,255,255,.22); transition:all .3s; cursor:pointer; pointer-events:auto;}
  .dot.on{background:var(--fire2); width:20px;}
  .hint{position:fixed; bottom:78px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--muted);
    z-index:25; opacity:.7; letter-spacing:.06em;}
  /* ====== Generic art bg ====== */
  .skybg{position:absolute; inset:0; background:
    radial-gradient(80% 60% at 50% 120%,rgba(255,122,24,.22),transparent 70%),
    linear-gradient(180deg,#0a0d1a 0%,#11152a 60%,#1a1322 100%);}
  .embers{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
  .ember{position:absolute; bottom:-10px; width:4px; height:4px; border-radius:99px;
    background:var(--fire2); box-shadow:0 0 8px var(--fire); animation:rise linear infinite; opacity:0;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0;}
    10%{opacity:.9;} 100%{transform:translateY(-340px) translateX(var(--dx,20px));opacity:0;}}
  .center-emoji{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:84px; filter:drop-shadow(0 8px 30px rgba(255,122,24,.4));}
  /* ====== Live demo chrome ====== */
  .live{position:relative; height:48vh; min-height:344px; width:100%; display:flex; flex-direction:column; background:#0a0d16;}
  @media (max-height:740px){ .live{height:44vh;} }
  .livebar{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line);
    font-size:11px; color:var(--muted); background:#0d1120;}
  .livebar .live-dot{width:8px;height:8px;border-radius:99px;background:#28d07a;box-shadow:0 0 8px #28d07a; animation:pulse 1.6s infinite;}
  @keyframes pulse{50%{opacity:.4;}}
  .livebar .url{font-family:ui-monospace,Menlo,monospace; opacity:.8;}
  .livebar .badge{margin-left:auto; background:rgba(40,208,122,.14); color:#28d07a; padding:3px 9px; border-radius:99px; font-weight:800; font-size:9.5px; letter-spacing:.1em;}
  .livebody{flex:1; position:relative; overflow:hidden;}
  /* bim demo */
  #bimCanvas{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .bim-ui{position:absolute; left:0; right:0; bottom:0; padding:10px; display:flex; flex-direction:column; gap:8px;
    background:linear-gradient(0deg,rgba(8,10,18,.92),transparent);}
  .bim-input{display:flex; gap:7px;}
  .bim-input input{flex:1; background:rgba(255,255,255,.08); border:1px solid var(--line); color:#fff;
    border-radius:11px; padding:11px 13px; font-size:14px; outline:none;}
  .bim-input input:focus{border-color:var(--fire2);}
  .bim-input button{background:linear-gradient(135deg,var(--fire),var(--fire2)); border:none; color:#1a1008;
    font-weight:800; border-radius:11px; padding:0 16px; font-size:14px; cursor:pointer;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:center;}
  .chip{font-size:11.5px; padding:6px 11px; border-radius:99px; border:1px solid var(--line);
    background:rgba(255,255,255,.05); color:#cfd3e0; cursor:pointer; transition:.15s;}
  .chip:active{transform:scale(.93);} .chip:hover{border-color:var(--fire2); color:#fff;}
  .houki{position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:5px; align-items:flex-start;}
  .hbadge{font-size:10.5px; padding:5px 10px; border-radius:8px; background:rgba(40,208,122,.16); color:#28d07a;
    border:1px solid rgba(40,208,122,.3); font-weight:700; opacity:0; transform:translateX(-12px);
    transition:.4s; display:flex; gap:6px; align-items:center;}
  .hbadge.show{opacity:1; transform:none;}
  .bim-spec{position:absolute; top:10px; right:10px; text-align:right; font-size:11px; color:#cfd3e0; line-height:1.7;}
  .bim-spec b{color:#fff; font-size:15px;}
  /* MU demo */
  .mu{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px;
    background:radial-gradient(90% 70% at 50% 0%,#1a1326,#0a0d16);}
  .mu-count{font-size:12px; letter-spacing:.2em; color:var(--muted);}
  .mu-count b{color:var(--fire2); font-variant-numeric:tabular-nums;}
  .mu-card{width:min(260px,72vw); aspect-ratio:4/5; border-radius:16px; position:relative; overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.5); border:1px solid var(--line); transition:.6s;}
  .mu-tee{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .mu-meta{font-size:12px; color:#cfd3e0;} .mu-meta b{color:#fff;}
  .mu-nums{display:flex; gap:14px; margin-top:2px;}
  .mu-num{text-align:center;} .mu-num b{display:block; font-size:18px; color:var(--gold); font-variant-numeric:tabular-nums;}
  .mu-num span{font-size:9.5px; color:var(--muted); letter-spacing:.1em;}
  /* JiuFlow demo */
  .jf{position:absolute; inset:0; display:flex; flex-direction:column; background:#0a0d16;}
  .jf-map{flex:1; position:relative; background:
    radial-gradient(60% 50% at 30% 40%,rgba(255,122,24,.08),transparent),
    linear-gradient(180deg,#0c1020,#0a0d16); overflow:hidden;}
  .jf-globe{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:130px; opacity:.18;}
  .ping{position:absolute; width:11px; height:11px; border-radius:99px; background:var(--fire2);}
  .ping::after{content:""; position:absolute; inset:-4px; border-radius:99px; border:2px solid var(--fire2); animation:ping 1.4s ease-out infinite;}
  @keyframes ping{0%{transform:scale(.6);opacity:1;}100%{transform:scale(2.6);opacity:0;}}
  .jf-tap{padding:12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px; align-items:center; background:#0d1120;}
  .jf-tech{width:100%; max-width:320px; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:13px;
    padding:13px 15px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:.15s;}
  .jf-tech:active{transform:scale(.97); background:rgba(255,122,24,.12);}
  .jf-tech .e{font-size:26px;} .jf-tech .t{text-align:left; flex:1;}
  .jf-tech .t b{display:block;} .jf-tech .t span{font-size:11px; color:var(--muted);}
  .jf-tech .go{font-size:11px; color:var(--fire2); font-weight:800;}
  .jf-counter{font-size:12px; color:var(--muted);} .jf-counter b{color:var(--fire2); font-size:16px; font-variant-numeric:tabular-nums;}
  /* Goods (founding) */
  .goods{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:18px;
    background:radial-gradient(90% 70% at 50% 0%,#1c1510,#0a0d16);}
  .goods-card{width:min(196px,52vw); aspect-ratio:4/5; border-radius:16px; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#202a3d,#2c3a5c); border:1px solid var(--line); box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .goods-art{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:72px;}
  .goods-tag{position:absolute; top:11px; left:11px; font-size:11px; font-weight:900; color:var(--fire2); letter-spacing:.12em; line-height:1.15; text-align:left;}
  .goods-info{text-align:center;}
  .goods-name{font-size:12.5px; color:#e6e9f2; font-weight:700;}
  .goods-price{font-size:22px; font-weight:900; color:#fff; margin-top:3px;} .goods-price span{font-size:11px; color:var(--muted); font-weight:600;}
  .goods-bar{width:min(260px,68vw); height:7px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; margin:9px auto 4px;}
  .goods-bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--fire),var(--fire2)); transition:width 1.2s cubic-bezier(.2,.8,.2,1);}
  .goods-n{font-size:11px; color:var(--muted);} .goods-n b{color:var(--fire2);}
  /* Links + video */
  .links{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px;}
  .link{font-size:12px; padding:8px 14px; border-radius:99px; text-decoration:none; font-weight:700;
    border:1px solid var(--line); color:#fff; background:rgba(255,255,255,.05); display:inline-flex; gap:6px; align-items:center;}
  .link.real{background:linear-gradient(135deg,rgba(255,122,24,.18),rgba(255,179,71,.12)); border-color:rgba(255,122,24,.4); color:var(--fire2);}
  .videoslot{margin-top:10px; width:100%; aspect-ratio:16/9; border-radius:12px; border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; background:rgba(255,255,255,.02); position:relative; overflow:hidden;}
  .videoslot iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  /* Contract finale */
  .contract{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:18px;
    background:radial-gradient(80% 80% at 50% 30%,#1c1407,#0a0d16);}
  .contract{overflow:auto;}
  .paper{background:linear-gradient(180deg,#f7f1e3,#efe6d2); color:#2a2418; border-radius:8px; padding:16px 20px;
    width:min(340px,80vw); box-shadow:0 24px 60px rgba(0,0,0,.5); font-family:"Hiragino Mincho ProN",serif; position:relative;}
  .paper h3{margin:0 0 9px; font-size:14px; letter-spacing:.06em; text-align:center; border-bottom:1px solid #cbb; padding-bottom:7px;}
  .prow{display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dotted #cbb;}
  .prow b{font-variant-numeric:tabular-nums;}
  .prow.big b{color:#b3530a; font-size:17px;}
  .sign{margin-top:14px; height:46px; position:relative;}
  .sign svg{position:absolute; right:0; bottom:0;}
  .sign-path{stroke:#1a1a2a; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-dasharray:520; stroke-dashoffset:520;}
  .stamp{position:absolute; right:-4px; bottom:-6px; width:48px; height:48px; border:3px solid #c0392b; border-radius:8px;
    color:#c0392b; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px; transform:rotate(-12deg) scale(0); opacity:0;
    transition:.5s cubic-bezier(.2,1.5,.4,1); font-family:sans-serif; text-align:center; line-height:1.1;}
  .stamp.on{transform:rotate(-12deg) scale(1); opacity:.92;}
  .memo{font-size:11px; color:#6a5d44; text-align:center; margin-top:8px; font-style:italic;}
  /* Intro overlay */
  #intro{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:24px; text-align:center; background:radial-gradient(70% 60% at 50% 70%,#1a1008,#070810); transition:opacity .8s;}
  #intro h1{font-size:clamp(30px,8vw,56px); margin:0; font-weight:900; letter-spacing:.02em;
    background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(255,122,24,.3);}
  #intro .sub{color:#cfd3e0; font-size:clamp(13px,3.4vw,16px); letter-spacing:.1em; max-width:520px; line-height:1.8;}
  #intro .tag{color:var(--gold); font-size:11px; letter-spacing:.34em; text-transform:uppercase;}
  #startBtn{margin-top:6px; cursor:pointer; border:none; border-radius:99px; padding:15px 34px; font-size:16px; font-weight:800;
    color:#1a1008; background:linear-gradient(135deg,var(--fire),var(--fire2)); box-shadow:0 10px 40px rgba(255,122,24,.5);
    transition:transform .15s;} #startBtn:active{transform:scale(.95);}
  #intro .fire{font-size:64px; animation:flick 2.4s ease-in-out infinite;}
  @keyframes flick{50%{transform:scale(1.08) rotate(-2deg); filter:brightness(1.15);}}
  .skip{position:fixed; top:14px; right:16px; z-index:61; font-size:12px; color:var(--muted); cursor:pointer; background:none; border:1px solid var(--line); border-radius:99px; padding:6px 14px;}
  @media (max-width:560px){ .narr{padding:13px 16px 16px;} .frame{max-height:80vh;} }
</style>
</head>
<body>

<button class="skip" id="skipIntro" style="display:none">スキップ →</button>

<div id="intro">
  <div class="fire">🔥</div>
  <div class="tag">動く投資ピッチ紙芝居</div>
  <h1>「作る」を、空気にする。</h1>
  <p class="sub">Amazonは「買う」を、メルカリは「売る」を空気にした。<br>―― では、「作る」は?<br><span style="opacity:.6">語りをめくると、本物が動き出す。その場で、触れる。</span></p>
  <button id="startBtn">▶ はじめる</button>
  <p class="tag" style="opacity:.5; margin-top:10px">クリック / 矢印キー / スワイプ でめくる</p>
</div>

<div id="hud" style="opacity:0; transition:opacity .6s">
  <div id="title">ロジックの、向こう側<small>動くピッチ紙芝居</small></div>
  <button id="voiceBtn" title="本人の声 ON / OFF">🔊<span id="voiceState">本人の声</span></button>
  <div id="meterWrap">
    <span style="font-size:14px">🔥</span>
    <div id="meter"><div id="meterFill"></div></div>
    <div id="meterTxt">確信 0%</div>
  </div>
</div>

<div id="stage"></div>

<div class="hint" id="hint">クリックで次へ →</div>

<div id="nav" style="opacity:0; transition:opacity .6s">
  <div class="navbtn" id="prevBtn">←</div>
  <div id="dots"></div>
  <div class="navbtn primary" id="nextBtn">次へ →</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ============================================================
   動くピッチ紙芝居『ロジックの、向こう側』
   ============================================================ */
const SCENES = [
  { type:'art', emoji:'💨', kicker:'一行の、革命',
    title:'「作る」を、空気にする。',
    body:'Amazonは「買う」を空気にした。メルカリは「売る」を空気にした。<br>では ―― <span class="em">「作る」は?</span>', meter:8 },

  { type:'art', emoji:'🛒', kicker:'かつて',
    title:'「買う」は、重かった。',
    body:'店へ行き、並び、運ぶ。Amazonが、それをワンクリックにした。<br>いま誰も、"買う"を意識しない。<span class="em">空気みたいに。</span>', meter:18 },

  { type:'art', emoji:'🏷️', kicker:'そして',
    title:'「売る」も、重かった。',
    body:'店を構え、仕入れ、値をつける。メルカリが、それを写真一枚にした。<br>誰もが、売り手になった。<span class="em">"売る"も、空気に。</span>', meter:28 },

  { type:'art', emoji:'🧱', kicker:'でも',
    title:'「作る」は、まだ重い。',
    body:'設計図、工場、資本、許可、何年も。<br>だから多くの人は、一度も"作らない"まま終わる。<span class="em">―― そこを、空気にする。</span>', meter:38 },

  { type:'mu', kicker:'MU ｜ 服を「作る」を、空気に',
    title:'言葉が、毎時、服になる。',
    body:'工場も在庫もいらない。AIが一時間にひとつ、服を生む。原価も売上も全部公開。<span class="em">"作る"が、こんなに軽い。</span>', meter:56 },

  { type:'bim', kicker:'bim.house ｜ 家を「作る」を、空気に',
    title:'言葉が、三秒で、建つ。',

  'voice/s0.mp3','voice/s1.mp3','voice/s2.mp3','voice/s3.mp3',

/* ===== WebAudio: 環境音楽 + 効果音(自前合成・外部ファイル0) ===== */
let AC=null, master=null, music=null;
function initAudio(){ if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);
}
function startMusic(){ if(!AC||music) return;
  const g=AC.createGain(); g.gain.value=0; g.connect(master);
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600; lp.Q.value=0.6; lp.connect(g);
  [110,164.81,220,329.63].forEach(f=>{ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f;
    const og=AC.createGain(); og.gain.value=0.2; o.connect(og); og.connect(lp);
    const d=AC.createOscillator(); d.type='sine'; d.frequency.value=f*1.006; d.connect(og); o.start(); d.start(); });
  const lfo=AC.createOscillator(); lfo.frequency.value=0.05; const lg=AC.createGain(); lg.gain.value=240;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  g.gain.linearRampToValueAtTime(0.15, AC.currentTime+5); music={g};
}
function duck(v){ if(music && AC) music.g.gain.linearRampToValueAtTime(v, AC.currentTime+0.5); }
function noiseBurst(dur,f0,f1,vol,type){ if(!AC||!soundOn) return;
  const len=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);
  const s=AC.createBufferSource(); s.buffer=buf;
  const bp=AC.createBiquadFilter(); bp.type=type||'bandpass'; bp.Q.value=0.7;
  bp.frequency.setValueAtTime(f0,AC.currentTime); bp.frequency.exponentialRampToValueAtTime(f1,AC.currentTime+dur);
  const g=AC.createGain(); g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  s.connect(bp); bp.connect(g); g.connect(master); s.start();
}
const sfxTurn=()=>noiseBurst(0.45,320,2400,0.16,'bandpass');
function sfxChime(base){ if(!AC||!soundOn) return; [0,4,7,12].forEach((st,i)=>{
  const f=(base||523.25)*Math.pow(2,st/12); const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f;
  const g=AC.createGain(); const t=AC.currentTime+i*0.11; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.15,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+1.3);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+1.4); }); }
function sfxThud(){ if(!AC||!soundOn) return; const o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(170,AC.currentTime); o.frequency.exponentialRampToValueAtTime(46,AC.currentTime+0.18);
  const g=AC.createGain(); g.gain.value=0.5; g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.3);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+0.32); noiseBurst(0.12,1200,300,0.12,'lowpass'); }

/* ============ bim.house live 3D ============ */
function initBim(){
  if(typeof THREE==='undefined'){ document.getElementById('bimSpec').textContent='3D読込失敗'; return; }
  const canvas=document.getElementById('bimCanvas');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(2,devicePixelRatio));
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0e1426);
  scene.fog=new THREE.Fog(0x0e1426,22,46);
  const cam=new THREE.PerspectiveCamera(42,1,.1,100); cam.position.set(7,4.6,8); cam.lookAt(0,1.3,0);
  const resize=()=>{const r=canvas.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); cam.aspect=r.width/Math.max(1,r.height); cam.updateProjectionMatrix();};
  scene.add(new THREE.HemisphereLight(0xfff3e2,0x2a3050,1.5));
  const sun=new THREE.DirectionalLight(0xffe2b8,2.0); sun.position.set(8,14,6); scene.add(sun);
  const fill=new THREE.DirectionalLight(0x9fb4ff,0.6); fill.position.set(-6,5,-4); scene.add(fill);
  // ground
  const ground=new THREE.Mesh(new THREE.CircleGeometry(13,48),new THREE.MeshStandardMaterial({color:0x141a2b,roughness:1}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-.02; scene.add(ground);
  const grid=new THREE.GridHelper(26,26,0x2a3350,0x1c2238); grid.position.y=0; scene.add(grid);
  const house=new THREE.Group(); scene.add(house);

  function parse(q){
    q=(q||'').toLowerCase();
    let floors=1;
    if(/(平屋|1階|ひらや)/.test(q)) floors=1;
    else if(/3階|３階|三階/.test(q)) floors=3;
    else if(/2階|２階|二階|２かい/.test(q)) floors=2;
    let rooms=2;
    const m=q.match(/(\d+)\s*(ldk|dk|k|部屋)/); if(m) rooms=Math.max(1,parseInt(m[1])+1);
    const sauna=/(サウナ|sauna)/.test(q);
    const garage=/(ガレージ|車庫|garage|カーポート)/.test(q);
    const court=/(中庭|courtyard|パティオ|patio)/.test(q);
    const terrace=/(屋上|テラス|ルーフ|roof|terrace)/.test(q);
    const flat=floors===1;
    let loc='';
    if(/(弟子屈|北海道|美留和|標茶)/.test(q)) loc='北海道・弟子屈 ｜ 所有地';
    else if(/熱海/.test(q)) loc='熱海 ｜ 所有地';
    else if(/和歌山/.test(q)) loc='和歌山 ｜ 所有地';
    return {floors,rooms,sauna,garage,court,terrace,flat,loc};
  }

  function build(spec){
    while(house.children.length) house.remove(house.children[0]);
    const fh=2.4, w=6.4, d=4.8;
    const wallMat=new THREE.MeshStandardMaterial({color:0xf2ede2,roughness:.85});
    const woodMat=new THREE.MeshStandardMaterial({color:0xb98a52,roughness:.7});
    const glassMat=new THREE.MeshStandardMaterial({color:0x9fd4e6,roughness:.1,metalness:.3,emissive:0x16323d,emissiveIntensity:.4});
    // body
    const bodyH=fh*spec.floors;
    const body=new THREE.Mesh(new THREE.BoxGeometry(w,bodyH,d),wallMat);
    body.position.y=bodyH/2; house.add(body);
    // floor slabs / windows
    for(let f=0;f<spec.floors;f++){
      for(let i=0;i<3;i++){
        const win=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,.1),glassMat);
        win.position.set(-2+i*2, f*fh+1.3, d/2+.01); house.add(win);
      }
    }
    // roof
    if(spec.flat){
      const slab=new THREE.Mesh(new THREE.BoxGeometry(w+.4,.3,d+.4),woodMat);
      slab.position.y=bodyH+.15; house.add(slab);
      if(spec.terrace){
        const rail=new THREE.Mesh(new THREE.BoxGeometry(w,.5,.08),new THREE.MeshStandardMaterial({color:0x445,roughness:.6}));
        rail.position.set(0,bodyH+.55,d/2); house.add(rail);
      }
    } else {
      const roof=new THREE.Mesh(new THREE.CylinderGeometry(.001,w*0.72,1.8,4),new THREE.MeshStandardMaterial({color:0x8a4b2a,roughness:.8}));
      roof.rotation.y=Math.PI/4; roof.position.y=bodyH+.9; roof.scale.z=d/w; house.add(roof);
    }
    // sauna annex
    if(spec.sauna){
      const sa=new THREE.Mesh(new THREE.BoxGeometry(2,2.1,2),woodMat);
      sa.position.set(w/2+1.2,1.05,-1); house.add(sa);
      const chimney=new THREE.Mesh(new THREE.BoxGeometry(.3,1,.3),new THREE.MeshStandardMaterial({color:0x333}));
      chimney.position.set(w/2+1.7,2.6,-1.4); house.add(chimney);
    }
    // garage
    if(spec.garage){
      const ga=new THREE.Mesh(new THREE.BoxGeometry(2.6,2,3.2),new THREE.MeshStandardMaterial({color:0xd8d2c4,roughness:.9}));
      ga.position.set(-w/2-1.5,1,.6); house.add(ga);
    }
    // courtyard tree
    if(spec.court){
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,1),woodMat); trunk.position.set(0,.5,0);
      const leaf=new THREE.Mesh(new THREE.IcosahedronGeometry(.8,0),new THREE.MeshStandardMaterial({color:0x4a8f4a,roughness:1}));
      leaf.position.set(0,1.5,0);
      // raise whole body to suggest U-shape (visual hint)
      house.add(trunk); house.add(leaf);
    }
    // door
    const door=new THREE.Mesh(new THREE.BoxGeometry(1,1.9,.12),new THREE.MeshStandardMaterial({color:0x5a3a22}));
    door.position.set(0.1,.95,d/2+.02); house.add(door);
    return {bodyH,w,d};
  }

  function updateUI(spec){
    const total=Math.round((spec.floors* (spec.rooms*9+18))+ (spec.sauna?6:0)+(spec.garage?16:0));
    document.getElementById('bimSpec').innerHTML=
      `${spec.loc?'<span style="color:#ffb347;font-weight:800">📍 '+spec.loc+'</span><br>':''}<b>${total}㎡</b><br>${spec.floors}階建て / ${spec.rooms}室${spec.sauna?'<br>＋サウナ':''}${spec.garage?'<br>＋ガレージ':''}${spec.terrace?'<br>＋屋上テラス':''}`;
    const checks=[['建ぺい率',true],['容積率',true],['斜線制限',true],['接道義務',true]];
    const hk=document.getElementById('bimHouki'); hk.innerHTML='';
    checks.forEach((c,i)=>{
      const b=document.createElement('div'); b.className='hbadge'; b.innerHTML='✓ '+c[0]+' 適合';
      hk.appendChild(b); setTimeout(()=>b.classList.add('show'),120+i*140);
    });
  }

  let target=null;
  function rebuild(q){ const spec=parse(q); build(spec); updateUI(spec); }
  rebuild(document.getElementById('bimInput').value);

  document.getElementById('bimGo').onclick=()=>rebuild(document.getElementById('bimInput').value);
  document.getElementById('bimInput').addEventListener('keydown',e=>{if(e.key==='Enter')rebuild(e.target.value);});
  document.querySelectorAll('#stage .chip').forEach(c=>c.onclick=()=>{
    const q=c.dataset.q; const inp=document.getElementById('bimInput'); if(inp){inp.value=q;} rebuild(q);
  });

  // drag rotate
  let drag=false,px=0,rot=0.7,auto=true;
  canvas.addEventListener('pointerdown',e=>{drag=true;auto=false;px=e.clientX;});
  window.addEventListener('pointerup',()=>drag=false);
  window.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-px)*0.01;px=e.clientX;}});

  function loop(){
    requestAnimationFrame(loop);
    if(auto) rot+=0.004;
    house.rotation.y=rot;
    resize();
    renderer.render(scene,cam);
  }
  resize(); loop();
  window.addEventListener('resize',resize);
}

/* ============ MU live ticker ============ */
const TEES=[
  {bg:'linear-gradient(135deg,#ff7a18,#ffb347)',t:'毎時、一着',n:'WAVE / 衝撃波'},
  {bg:'linear-gradient(135deg,#222,#555)',t:'MU de MU',n:'Monochrome 01'},
  {bg:'linear-gradient(135deg,#1d6fb8,#5fb6e6)',t:'世界へ',n:'Hawaii Fes'},
  {bg:'linear-gradient(135deg,#2a9d5c,#7bd39a)',t:'透明だ',n:'Transparency'},
  {bg:'linear-gradient(135deg,#7b3fa0,#c08fe0)',t:'NOUNS',n:'Owner #042'},
];
function initMU(){
  const tee=document.getElementById('muTee'), card=document.getElementById('muCard');
  const nameEl=document.getElementById('muName'), genEl=document.getElementById('muGen'), totalEl=document.getElementById('muTotal');
  let gi=0, gen=14, total=8421;
  function show(i){
    const t=TEES[i%TEES.length];
    card.style.background=t.bg;
    tee.innerHTML=`<div style="text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)">
      <div style="font-size:11px;letter-spacing:.3em;opacity:.85">wearmu</div>
      <div style="font-size:30px;font-weight:900;margin:6px 0">${t.t}</div>
      <div style="font-size:11px;opacity:.85">${t.n}</div></div>`;
    nameEl.textContent=t.n;
  }
  show(0);
  totalEl.textContent=total.toLocaleString(); genEl.textContent=gen;
  // rotate "designs" + fake countdown to feel毎時
  setInterval(()=>{ gi++; card.style.transform='rotateY(90deg)';
    setTimeout(()=>{ show(gi); card.style.transform='rotateY(0)'; gen++; total++;
      genEl.textContent=gen; totalEl.textContent=total.toLocaleString(); },300);
  },3200);
  const cd=document.getElementById('muCountdown');
  let s=3599;
  setInterval(()=>{ s=(s-1+3600)%3600; const m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0'); cd.textContent=`${m}:${ss}`; },1000);
}

/* ============ contract finale ============ */
let contractRun=false;
function runContract(){
  if(contractRun) return; contractRun=true;
  const cval=document.getElementById('cval'), cinv=document.getElementById('cinv');
  function countTo(el,target,prefix,dur){
    const t0=performance.now();
    function step(t){ const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      el.textContent=prefix+Math.round(target*e).toLocaleString(); if(k<1)requestAnimationFrame(step);} requestAnimationFrame(step);
  }
  setTimeout(()=>countTo(cval,10000000000,'¥',1400),400);
  setTimeout(()=>countTo(cinv,1000000000,'¥',1400),1100);
  const path=document.getElementById('signPath');
  setTimeout(()=>{ path.style.transition='stroke-dashoffset 1.3s ease'; path.style.strokeDashoffset='0'; sfxChime(523); },2200);
  setTimeout(()=>{ document.getElementById('stamp').classList.add('on'); sfxThud(); },3500);
  setTimeout(()=>{ document.getElementById('memo').textContent='「ロジックは、後からついてくる」'; },3900);
}

document.addEventListener('click',e=>{

  }
});
